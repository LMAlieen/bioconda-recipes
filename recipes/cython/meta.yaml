      #  - gcc_linux-aarch64  
      #  - gxx_impl_linux-aarch64 
      #  - gxx_linux-aarch64 
        - python 2.7.16
        - ncurses 6.5
        - openssl
    host:
        - libffi 3.5.2 
        - ncurses 6.5 
        - pip #18.0 py27_1001
        - python 2.7.16
        - ncurses 6.5
        - readline 7.0 
        - setuptools #40.4.0 
        - tk #8.6.8 
        - wheel # 0.31.1
        - zlib #1.2.11
