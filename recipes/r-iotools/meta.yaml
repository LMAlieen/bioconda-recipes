{% set name = "r-iotools" %}
{% set version = "0.3_5" %}
{% set build = 2 %}
{% set date = "2024-01-01" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.rforge.net/iotools/snapshot/iotools_{{ version.replace('_', '-') }}.tar.gz #https://cran.r-project.org/src/contrib/{{ name }}_{{ version.replace('_', '-') }}.tar.gz
  sha256: cb13fd2dde7077457b66a4884f0cb76f75d4e36d758280cc4fb145773043b3a9

build:
  number: {{ build }}
  run_exports:
    - {{ pin_subpackage(name,max_pin="x.x") }}
  skip: true  # [win]
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - pkg-config
    - sysroot_linux-aarch64  # [aarch64]
  host:
    - r-base 4.2
    - r-digest
    - r-stringi
    - zlib
    - bzip2
    - xz
    - curl
    - openssl
    - libiconv
    - sysroot_linux-aarch64  # [aarch64]
  run:
    - r-base 4.2
    - r-digest
    - r-stringi
    - {{ pin_compatible('zlib') }}
    - {{ pin_compatible('bzip2') }}
    - {{ pin_compatible('xz') }}
    - {{ pin_compatible('curl') }}
    - {{ pin_compatible('openssl') }}
    - {{ pin_compatible('libiconv') }}

test:
  commands:
    - $R -e "library('iotools')"  # [not win]

about:
  home: https://CRAN.R-project.org/package=iotools
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file: {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2
  summary: 'I/O Tools for Streaming'
  description: |
    Provides a set of tools for I/O operations while streaming or 
    chunking data. Includes functions for reading and writing binary 
    and delimited files, chunking and streaming data, and handling 
    various data formats.
  doc_url: https://cran.r-project.org/web/packages/iotools/
  dev_url: https://github.com/cran/iotools

extra:
  additional-platforms:
    - linux-aarch64
